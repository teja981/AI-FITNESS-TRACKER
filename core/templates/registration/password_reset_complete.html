{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Password reset complete — FITNESS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --primary:#4A00E0; --primary-2:#6A1B9A; }
    html,body{height:100%;margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#E6E6FA,#F8F0FF);display:flex;align-items:center;justify-content:center}
    .card{width:420px;border-radius:14px;padding:34px 42px;background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.5));backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(74,0,224,0.08);border:1px solid rgba(255,255,255,0.6)}
    h2{margin:0 0 10px;font-size:1.7rem;color:var(--primary);text-align:center}
    p{color:#555;text-align:center;margin:0 0 18px;font-weight:600}
    a.login{display:block;text-align:center;color:var(--primary);font-weight:700;text-decoration:none}
    @media (max-width:480px){.card{width:92%;padding:20px}}
  </style>
</head>
<body>
  <div class="card">
    <h2>Password reset successful</h2>
    <p>Your password has been changed. You can now sign in with your new password.</p>
    <a class="login" href="{% url 'login' %}">Go to login</a>
  </div>
</body>
</html>
