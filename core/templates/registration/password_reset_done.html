{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Check your email — FITNESS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --primary:#4A00E0; --primary-2:#6A1B9A; }
    html,body{height:100%;margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#E6E6FA,#F8F0FF);display:flex;align-items:center;justify-content:center}
    .card{width:420px;border-radius:14px;padding:34px 42px;background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.5));backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(74,0,224,0.08);border:1px solid rgba(255,255,255,0.6)}
    h2{margin:0 0 10px;font-size:1.7rem;color:var(--primary);text-align:center}
    p{color:#555;text-align:center;margin:0 0 18px;font-weight:600}
    .btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--primary),var(--primary-2));color:#fff;font-weight:700;font-size:1em;cursor:pointer;margin-top:10px}
    a.back{display:block;text-align:center;margin-top:12px;color:var(--primary);font-weight:600;text-decoration:none}
    @media (max-width:480px){.card{width:92%;padding:20px}}
  </style>
</head>
<body>
  <div class="card">
    <h2>Check your email</h2>
    <p>If an account with that email exists we sent instructions to reset your password.</p>
    <a class="back" href="{% url 'login' %}">Return to login</a>
  </div>
</body>
</html>
