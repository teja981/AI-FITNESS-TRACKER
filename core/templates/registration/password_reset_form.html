{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Password reset — FITNESS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root{ --primary:#4A00E0; --primary-2:#6A1B9A; }
    html,body{height:100%;margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#E6E6FA,#F8F0FF);display:flex;align-items:center;justify-content:center}
    body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 10% 20%, rgba(74,0,224,0.08), transparent 8%),radial-gradient(circle at 90% 80%, rgba(106,27,154,0.06), transparent 8%);filter:blur(40px);animation:bgPulse 8s ease-in-out infinite;z-index:0}
    @keyframes bgPulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
    .card{position:relative;z-index:1;width:420px;border-radius:14px;padding:34px 42px;background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.5));backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(74,0,224,0.08);border:1px solid rgba(255,255,255,0.6)}
    h2{margin:0 0 12px;font-size:1.9rem;color:var(--primary);text-align:center;font-weight:700}
    p.lead{color:#555;text-align:center;margin:0 0 18px;font-weight:600}
    form{margin-top:10px}
    .form-row{position:relative;margin-bottom:14px}
    .form-row i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#AAA}
    input[type="email"]{padding:12px 12px 12px 46px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);width:100%;box-sizing:border-box;background:linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.45));outline:none; font-size:14px}
    input[type="email"]:focus{box-shadow:0 6px 30px rgba(74,0,224,0.08);border-color:var(--primary)}
    .btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--primary),var(--primary-2));color:#fff;font-weight:700;font-size:1em;cursor:pointer;margin-top:8px;box-shadow:0 10px 30px rgba(106,27,154,0.12)}
    .help{font-size:0.9rem;color:#666;text-align:center;margin-top:12px}
    .back-login{display:block;text-align:center;margin-top:14px;color:var(--primary);font-weight:600;text-decoration:none}
    .errorlist{color:#e74c3c;font-size:13px;list-style:none;padding:0;margin:6px 0 0}
    @media (max-width:480px){.card{width:92%;padding:20px}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h2><i class="fas fa-key" style="margin-right:8px"></i> Reset password</h2>
    <p class="lead">Enter your account email and we'll send reset instructions.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <i class="fas fa-envelope"></i>
        {{ form.email }}
        {% if form.email.errors %}
          <ul class="errorlist">
            {% for e in form.email.errors %}
              <li>{{ e }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      </div>

      <button class="btn" type="submit">Send reset email</button>
    </form>

    <a class="back-login" href="{% url 'login' %}">← Back to login</a>
  </div>
</body>
</html>
