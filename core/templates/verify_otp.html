{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OTP Verification - FITNESS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root{
            --primary: #4A00E0;
            --primary-2: #6A1B9A;
            --glass-strong: rgba(255,255,255,0.75);
            --muted: #666;
            --accent-glow: rgba(74,0,224,0.18);
            --card-w: 350px;
        }

        /* Page background + slow animated glow */
        html,body{height:100%;margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#E6E6FA 0%, #F8F0FF 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
        body::before{
            content:"";
            position:fixed;
            inset:-25%;
            background:
              radial-gradient(circle at 10% 20%, rgba(74,0,224,0.12), transparent 8%),
              radial-gradient(circle at 85% 80%, rgba(106,27,154,0.08), transparent 8%),
              linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02));
            filter: blur(46px) saturate(120%);
            animation: bgFloat 10s ease-in-out infinite;
            z-index:0;
        }
        @keyframes bgFloat {0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

        /* Card - glass look */
        .card {
            position:relative;
            z-index:1;
            width:var(--card-w);
            border-radius:14px;
            padding:20px;
            background: linear-gradient(180deg, var(--glass-strong), rgba(255,255,255,0.55));
            backdrop-filter: blur(10px) saturate(120%);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 14px 48px rgba(74,0,224,0.08);
            transform-origin:center;
            animation: cardPop 0.6s cubic-bezier(.2,.9,.2,1) both;
            text-align:center;
        }
        @keyframes cardPop { from{opacity:0; transform:translateY(10px) scale(0.985)} to{opacity:1; transform:translateY(0) scale(1)} }

        /* floating accent */
        .card::after{
            content:"";
            position:absolute;
            left:-40px; top:-40px;
            width:160px; height:160px;
            background: radial-gradient(circle at 20% 20%, rgba(74,0,224,0.18), transparent 22%);
            filter: blur(28px);
            pointer-events:none;
        }

        /* Header: shimmering text animation */
        h2 {
            font-weight:700;
            margin:0 0 12px;
            font-size:1.5rem;
            color:var(--primary);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            letter-spacing:0.3px;
            position:relative;
            overflow:visible;
        }
        /* shimmer */
        .shimmer {
            display:inline-block;
            background: linear-gradient(90deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.45) 45%, rgba(255,255,255,0.0) 80%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmerAnim 2.6s linear infinite;
        }
        @keyframes shimmerAnim { 0%{background-position:200% 0}100%{background-position:-200% 0} }

        /* small subtitle */
        .subtitle { color:var(--muted); margin-bottom:4px; font-weight:600; font-size:0.9rem; }

        /* OTP inputs row */
        .otp-inputs {
            display:flex;
            justify-content:space-between;
            gap:8px;
            margin:12px 0 4px;
            user-select:none;
        }
        .otp-inputs input {
            width:36px; height:44px;
            border-radius:12px;
            border:1px solid rgba(0,0,0,0.06);
            background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(250,250,250,0.95));
            font-size:20px; font-weight:700; text-align:center;
            outline:none; caret-color:var(--primary);
            transition: transform .14s ease, box-shadow .18s ease, border-color .18s ease;
            box-shadow: inset 0 -6px 14px rgba(0,0,0,0.03);
        }
        .otp-inputs input:hover { transform: translateY(-3px); border-color: rgba(106,27,154,0.24) }
        .otp-inputs input:focus {
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(74,0,224,0.12), 0 0 10px rgba(74,0,224,0.06) inset;
            transform: translateY(-6px) scale(1.02);
            background: #fff;
        }

        /* animated caret blink for last focused input (subtle) */
        .otp-inputs input:focus { animation: subtlePulse 1.6s infinite; }
        @keyframes subtlePulse {0%{box-shadow:0 8px 30px rgba(74,0,224,0.12)}50%{box-shadow:0 10px 36px rgba(74,0,224,0.14)}100%{box-shadow:0 8px 30px rgba(74,0,224,0.12)}}

        /* Demo badge with pulse */
        .demo-badge{
            display:inline-block;
            margin-top:4px;
            font-weight:700;
            color:var(--primary-2);
            background: linear-gradient(90deg, rgba(106,27,154,0.06), rgba(74,0,224,0.04));
            padding:4px 8px;
            border-radius:999px;
            box-shadow: 0 8px 28px rgba(106,27,154,0.06);
            animation: badgePulse 2.2s ease-in-out infinite;
            font-size: 0.85rem;
        }
        @keyframes badgePulse {0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(0)}}

        /* info text with sliding in animation */
        .info-text{ font-size:13px; color:var(--muted); margin-top:8px; line-height:1.3; }
        .info-text a{ color:var(--primary); font-weight:700; text-decoration:none; transition: color .18s, transform .12s; display:inline-block; }
        .info-text a:hover{ color:var(--primary-2); transform:translateY(-2px); text-decoration:underline; }

        /* keypad grid styling + key animations */
        .keypad{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
            margin-top:8px;
            user-select:none;
        }
        .key{
            height:40px; border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            font-size:16px; font-weight:800; cursor:pointer;
            background: linear-gradient(180deg, #f7f7f8, #f0f0f2);
            border:1px solid rgba(0,0,0,0.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: transform .12s ease, background .18s ease, box-shadow .18s ease, color .15s;
            position:relative; overflow:hidden;
        }
        .key:active{ transform:translateY(2px) scale(0.995); }
        .key:hover{ transform:translateY(-6px); box-shadow: 0 18px 40px rgba(74,0,224,0.08); background: linear-gradient(90deg, var(--primary), var(--primary-2)); color:#fff; border-color:var(--primary) }
        /* key ripple (JS will inject ripple element) */
        .ripple{ position:absolute; border-radius:999px; transform: translate(-50%,-50%); pointer-events:none; background: rgba(255,255,255,0.35); width:8px; height:8px; animation: rippleAnim .6s ease-out forwards }
        @keyframes rippleAnim { to{ width:140px; height:140px; opacity:0 } }

        /* backspace svg color */
        .key-backspace svg{ width:22px; height:22px; transition: fill .18s ease }
        .key-backspace:hover svg{ fill:#fff }

        /* verify button (glow) */
        .btn-verify{
            margin-top:12px; width:100%; padding:10px;
            border:none; border-radius:12px; font-weight:800; font-size:0.95rem; cursor:pointer;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            color:#fff; box-shadow: 0 18px 50px rgba(106,27,154,0.14), 0 0 40px rgba(74,0,224,0.08);
            transition: transform .14s ease, box-shadow .18s ease;
        }
        .btn-verify:hover{ transform:translateY(-6px); box-shadow: 0 28px 70px rgba(106,27,154,0.18), 0 0 60px rgba(74,0,224,0.12) }

        /* Django error/message styling */
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .error, .alert { /* Use alert for general messages and error for errors */
            background-color: #fce4e4;
            color: #c62828;
            border-color: #ef9a9a;
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-color: #a5d6a7;
        }

        /* responsive */
        @media (max-width:480px){
            .card{ width:92%; padding:18px }
            .otp-inputs input{ width:36px; height:44px; font-size:20px }
            .key{ height:40px; font-size:16px }
        }
    </style>
</head>
<body>
    <div class="card" role="main" aria-labelledby="otp-title">
        <h2 id="otp-title"><span class="shimmer">H</span></h2>
        <div class="subtitle">Type the 6-digit code we sent to your phone or email</div>

                {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

        <form method="POST" id="otp-form" autocomplete="off" novalidate>
            {% csrf_token %}
            <div class="otp-inputs" id="otp-inputs" aria-hidden="false" aria-label="OTP input fields">
                <input type="text" id="otp1" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" id="otp2" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" id="otp3" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" id="otp4" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" id="otp5" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" id="otp6" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            </div>

            <div class="info-text" role="status" aria-live="polite">
                Didn't get OTP code? <a href="{% url 'resend_otp_url_name' %}" id="resend-link" aria-label="Resend code">RESEND</a>
                <div style="height:6px"></div>
                <span class="demo-badge">Demo: <strong style="margin-left:6px">123456</strong></span>
            </div>

            <div class="keypad" aria-label="Numeric keypad for OTP input" role="group">
                <div class="key" data-key="1" tabindex="0">1</div>
                <div class="key" data-key="2" tabindex="0">2</div>
                <div class="key" data-key="3" tabindex="0">3</div>
                <div class="key" data-key="4" tabindex="0">4</div>
                <div class="key" data-key="5" tabindex="0">5</div>
                <div class="key" data-key="6" tabindex="0">6</div>
                <div class="key" data-key="7" tabindex="0">7</div>
                <div class="key" data-key="8" tabindex="0">8</div>
                <div class="key" data-key="9" tabindex="0">9</div>
                <div style="visibility:hidden"></div>
                <div class="key" data-key="0" tabindex="0">0</div>
                <div class="key key-backspace" id="backspace" title="Backspace" aria-label="Backspace key" tabindex="0">X</div>
            </div>

                    <input type="hidden" name="phone" value="{{ phone }}">

                    <input type="hidden" name="otp" id="otp-input-hidden" />

            <button type="submit" class="btn-verify">Verify</button>
        </form>
    </div>

    <script>
        // Elements
        const inputs = Array.from(document.querySelectorAll('.otp-inputs input'));
        const hiddenInput = document.getElementById('otp-input-hidden');
        const form = document.getElementById('otp-form');
        const keypad = document.querySelector('.keypad');

        // Focus management and digit-only enforcement
        inputs.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                // keep only digits
                input.value = input.value.replace(/[^0-9]/g,'').slice(0,1);
                if (input.value && i < inputs.length - 1) {
                    inputs[i+1].focus();
                }
                updateHidden();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '') {
                    if (i > 0) inputs[i-1].focus();
                } else if (e.key === 'ArrowLeft' && i > 0) {
                    inputs[i-1].focus();
                } else if (e.key === 'ArrowRight' && i < inputs.length-1) {
                    inputs[i+1].focus();
                } else if (/^[0-9]$/.test(e.key)) {
                    // allow
                } else if (e.key !== 'Tab') {
                    // do nothing (let browser handle other keys)
                }
            });

            // Paste support: allow pasting entire 6-digit code into any box
            input.addEventListener('paste', (e) => {
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                if (/^\d{6}$/.test(paste)) {
                    e.preventDefault();
                    paste.split('').forEach((ch, idx) => {
                        if (inputs[idx]) inputs[idx].value = ch;
                    });
                    updateHidden();
                    inputs[inputs.length-1].focus();
                }
            });
        });

        function updateHidden() {
            // Combines all 6 single inputs into the hidden field named 'otp'
            hiddenInput.value = inputs.map(i => i.value || '').join('');
        }

        // Initialize hidden value (in case of prefilled)
        updateHidden();

        // Keypad: click or keyboard activation
        function createRipple(elem, x, y) {
            const r = document.createElement('span');
            r.className = 'ripple';
            r.style.left = x + 'px';
            r.style.top = y + 'px';
            elem.appendChild(r);
            setTimeout(()=> r.remove(), 650);
        }

        keypad.addEventListener('click', (e) => {
            const key = e.target.closest('.key');
            if (!key) return;
            // ripple effect
            const rect = key.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createRipple(key, x, y);

            if (key.id === 'backspace') {
                handleBackspace();
            } else {
                const val = key.dataset.key;
                handleDigit(val);
            }
        });

        // Make keys accessible by keyboard (Enter/Space)
        keypad.addEventListener('keydown', (e) => {
            const key = e.target.closest('.key');
            if (!key) return;
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                key.click();
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                handleBackspace();
            }
        });

        function handleDigit(d) {
            for (let inp of inputs) {
                if (!inp.value) {
                    inp.value = d;
                    inp.focus();
                    break;
                }
            }
            updateHidden();
        }
        function handleBackspace() {
            for (let i = inputs.length -1; i >=0; i--) {
                if (inputs[i].value) {
                    inputs[i].value = '';
                    inputs[i].focus();
                    break;
                }
                if (i > 0) inputs[i-1].focus();
            }
            updateHidden();
        }

        // Backspace keyboard support on entire page for convenience
        document.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'Backspace') {
                e.preventDefault();
                handleBackspace();
            } else if (/^[0-9]$/.test(e.key)) {
                handleDigit(e.key);
            }
        });

        // Resend handler (AJAX suggestion)
        document.getElementById('resend-link').addEventListener('click', (e) => {
            // Only prevent default if you are using AJAX. If using a standard URL click, remove e.preventDefault()
            // e.preventDefault(); 
            const link = e.target;
            // Simple visual feedback (You should replace this with a proper AJAX/Fetch call if you want to stay on the page)
            // link.textContent = 'SENDING...';
            // setTimeout(()=>{ link.textContent = 'RESEND'; alert('OTP resent (demo).') }, 900);
        });

        // Submit validation (Corrected for Django POST submission)
        form.addEventListener('submit', (e) => {
            updateHidden(); // Always aggregate the OTP before submission

            // Client-side check: ensure all 6 digits are present
            if (hiddenInput.value.length !== inputs.length) {
                e.preventDefault(); // Stop form submission if incomplete
                
                // Gentle UI hint (error shake)
                inputs.forEach((inp) => {
                    if (!inp.value) {
                        inp.classList.add('error-shake');
                        setTimeout(()=> inp.classList.remove('error-shake'), 600);
                    }
                });
                
                const firstEmpty = inputs.find(i => !i.value);
                if (firstEmpty) firstEmpty.focus();
                
                // Optional: Provide a visual error message instead of relying solely on the shake
                // alert('Please enter the full 6-digit OTP code.');
            }
            // If the length is correct (6 digits), the form submission proceeds naturally to Django.
        });

        // Small CSS-less shake class (applied briefly)
        (function addShakeStyle(){
            const css = '.error-shake{ animation: shakeX .5s ease; box-shadow: 0 10px 30px rgba(255,0,0,0.06) } @keyframes shakeX { 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)} }';
            const s = document.createElement('style'); s.appendChild(document.createTextNode(css)); document.head.appendChild(s);
        })();
    </script>
</body>
</html>
